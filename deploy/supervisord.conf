[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:api]
command=/app/deploy/run-api.sh
directory=/app
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=10

# Stagger agent startup to avoid a memory spike when all 5 processes load at once.
[program:agent1]
command=/bin/sh -c "sleep 5 && exec /app/.venv/bin/payguard-agent1"
directory=/app
autostart=true
autorestart=true
startsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:agent2]
command=/bin/sh -c "sleep 10 && exec /app/.venv/bin/payguard-agent2"
directory=/app
autostart=true
autorestart=true
startsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:agent3]
command=/bin/sh -c "sleep 15 && exec /app/.venv/bin/payguard-agent3"
directory=/app
autostart=true
autorestart=true
startsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20

[program:agent4]
command=/bin/sh -c "sleep 20 && exec /app/.venv/bin/payguard-agent4"
directory=/app
autostart=true
autorestart=true
startsecs=8
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
priority=20
